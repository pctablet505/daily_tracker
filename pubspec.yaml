name: daily_tracker
description: "A cross-platform daily task tracker with Google Drive sync and auto-updates."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^2.6.1
  get_it: ^8.0.3

  # Navigation
  go_router: ^14.8.1

  # Database & Storage
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  workmanager: ^0.5.2

  # Google Drive Sync
  google_sign_in: ^6.2.1
  googleapis: ^12.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Security
  crypto: ^3.0.6
  local_auth: ^2.2.0

  # UI & Charts
  fl_chart: ^0.66.0
  table_calendar: ^3.0.9
  flutter_slidable: ^3.1.0
  flutter_markdown: ^0.6.18
  lottie: ^3.0.0
  smooth_page_indicator: ^1.1.0
  shimmer: ^3.0.0
  confetti: ^0.8.0

  # Utilities
  package_info_plus: ^5.0.1
  url_launcher: ^6.2.5
  share_plus: ^7.2.2
  file_picker: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.3.3
  equatable: ^2.0.5
  collection: ^1.19.0

  # Permission handling
  permission_handler: ^11.1.0

  # Installer for Android APK updates
  open_filex: ^4.3.4
  device_info_plus: ^9.1.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: ^0.5.30
  sqlite3: ^2.4.2
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/animations/
