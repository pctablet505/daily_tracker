name: daily_tracker
description: "A daily habit tracker for Android: one-tap logging, honest streaks, backup and in-app updates."
publish_to: 'none'
version: 2.0.2+5

environment:
  sdk: ^3.13.5

dependencies:
  confetti: ^0.8.0
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  local_auth: ^3.0.2
  open_filex: ^4.7.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+1
  timezone: ^0.11.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
